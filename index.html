<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Slow Hours</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slow Hours">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&family=Instrument+Serif:ital@0;1&family=Nixie+One&family=Outfit:wght@100;200;300&family=Silkscreen&family=Space+Grotesk:wght@300;400;500&family=Tilt+Neon&display=swap">
<link rel="stylesheet" href="css/app.css?v=2">
</head>
<body>
<div id="probe"></div>
<div id="stage"><div id="track"></div></div>

<div id="hdots" aria-hidden="true"></div>
<div id="vdots" aria-hidden="true"></div>
<div id="label" aria-live="polite"></div>
<div id="hint">Swipe sideways for themes · up and down for variations · tap for settings</div>

<div id="bar" role="toolbar" aria-label="Clock settings">
  <span id="bar-name"><b>Slow Hours</b></span>
  <div class="ctl">
    <button class="chip" id="b-24" type="button" aria-pressed="false">24-hour</button>
    <button class="chip" id="b-shuffle" type="button" aria-pressed="false">Shuffle every 5 min</button>
    <button class="chip" id="b-awake" type="button" aria-pressed="true">Keep screen on</button>
    <label for="b-ws">Workday <select id="b-ws" aria-label="Workday starts"></select> to <select id="b-we" aria-label="Workday ends"></select></label>
    <button class="chip" id="b-hide" type="button" aria-label="Hide settings">Done</button>
  </div>
</div>

<script src="js/core.js?v=2"></script>
<script src="js/t-aurora.js?v=2"></script>
<script src="js/t-pixel.js?v=2"></script>
<script src="js/t-orbit.js?v=2"></script>
<script src="js/t-dial.js?v=2"></script>
<script src="js/t-glow.js?v=2"></script>
<script src="js/t-words.js?v=2"></script>
<script src="js/t-sky.js?v=2"></script>
<script src="js/t-drain.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
