<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Slow Hours</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slow Hours">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Instrument+Serif:ital@0;1&family=Nixie+One&family=Outfit:wght@100;200;300&family=Space+Grotesk:wght@300;400;500&display=swap">
<style>
/* Layout: a full-bleed horizontal track of seven clock faces, one per screen; swipe moves between them. */
:root{
  --ink:#0b0d10; --paper:#f3efe8; --dim:rgba(243,239,232,.5); --line:rgba(243,239,232,.14);
  --ember:#ff8a3d; --mint:#7fe0c8; --peach:#ffb38a; --lilac:#c9b8ff;
  --f-display:"Outfit",system-ui,sans-serif;
  --f-ui:"Space Grotesk",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --f-serif:"Instrument Serif",Georgia,serif;
  --f-nixie:"Nixie One","DM Mono",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:var(--ink)}
#track{display:flex;width:100%;height:100%;will-change:transform}
.face{position:relative;flex:0 0 100%;width:100%;height:100%;overflow:hidden}
.face canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pad{position:absolute;inset:0;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* Aurora */
.aurora-ui{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center}
.a-time{font-family:var(--f-display);font-weight:100;font-size:min(30vw,64vh);line-height:.86;letter-spacing:-.02em;color:rgba(255,255,255,.94);display:flex;align-items:flex-start;text-shadow:0 0 40px rgba(255,255,255,.12)}
.a-colon{transition:opacity .5s ease;margin:0 -.02em;transform:translateY(-.04em)}
.a-colon.off{opacity:.25}
.a-suf{font-size:.13em;font-weight:300;letter-spacing:.2em;margin-left:.3em;margin-top:.5em;opacity:.7}
.a-date{font-family:var(--f-ui);font-weight:400;font-size:max(11px,2.6vh);letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.a-sec{width:min(40vw,280px);height:2px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
.a-sec i{display:block;height:100%;background:rgba(255,255,255,.75);transform-origin:left;transform:scaleX(0)}

/* Orbit */
#f-orbit{background:#07090c}
.orbit-ui{display:flex;justify-content:flex-end;align-items:center}
.o-read{width:34%;display:grid;gap:1.6vh}
.o-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:.6vh}
.o-k{font-family:var(--f-mono);font-size:max(10px,2.2vh);letter-spacing:.18em;text-transform:uppercase;color:var(--c)}
.o-v{font-family:var(--f-display);font-weight:200;font-size:min(15vh,7vw);line-height:1;color:var(--paper)}
.o-date{font-family:var(--f-mono);font-size:max(10px,2.2vh);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
@media (orientation:portrait){.o-read{display:none}}

/* Sweep */
.sw-foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--f-mono);font-size:max(10px,2.1vh);letter-spacing:.16em;text-transform:uppercase;color:rgba(236,229,216,.42);pointer-events:none;
  padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sw-foot span:last-child{text-align:right}

/* Nixie */
#f-nixie{background:radial-gradient(120% 90% at 50% 115%,#2b1607 0%,#100a07 55%,#070505 100%)}
.nx{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh}
.tubes{--tw:min(9.6vw,30vh);position:relative;display:flex;align-items:flex-end;gap:min(1.3vw,10px)}
.tubes::after{content:"";position:absolute;left:-6%;right:-6%;bottom:-12%;height:40%;background:radial-gradient(50% 50% at 50% 50%,rgba(255,110,20,.22),transparent 70%);pointer-events:none}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.tube{position:relative;width:var(--tw);height:calc(var(--tw)*1.7);border-radius:calc(var(--tw)*.5) calc(var(--tw)*.5) 8px 8px;overflow:hidden;
  background:linear-gradient(90deg,rgba(255,235,215,.08),rgba(255,235,215,.02) 30%,rgba(255,235,215,0) 60%,rgba(255,235,215,.06));
  box-shadow:inset 0 0 0 1px rgba(255,220,190,.13),inset 0 -18px 26px rgba(0,0,0,.45)}
.tube.narrow{width:calc(var(--tw)*.36)}
.tube::before{content:"";position:absolute;top:6%;bottom:10%;left:16%;width:9%;border-radius:99px;background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.02));z-index:3}
.tube::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(16,10,6,.6) 1px,transparent 1.5px);background-size:5px 5px;opacity:.55;z-index:2}
.d{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-nixie);font-size:calc(var(--tw)*1.22);line-height:1;padding-top:6%;color:rgba(255,150,80,.07);transition:color .12s,text-shadow .12s}
.d.on{color:#ffd9b3;text-shadow:0 0 3px #ffa050,0 0 10px #ff6a00,0 0 24px rgba(255,90,0,.75),0 0 54px rgba(255,80,0,.4)}
.dots2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--tw)*.32);padding-top:12%}
.dots2 i{width:calc(var(--tw)*.11);aspect-ratio:1;border-radius:50%;background:rgba(255,150,80,.1);transition:background .15s,box-shadow .15s}
.dots2.on i{background:#ffcf9e;box-shadow:0 0 6px #ff8a2a,0 0 16px rgba(255,90,0,.7)}
.sock{width:105%;height:calc(var(--tw)*.2);border-radius:3px 3px 6px 6px;background:linear-gradient(#2e2722,#120f0d);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.nx-foot{font-family:var(--f-mono);font-size:max(10px,2.2vh);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,160,90,.55)}

/* Words */
#f-words{background:radial-gradient(90% 80% at 50% 40%,#1a1b17,#0b0b0a)}
.words-ui{display:flex;flex-direction:column;align-items:center;justify-content:center}
.wgrid{--cell:30px;display:grid;grid-template-columns:repeat(16,var(--cell));grid-auto-rows:var(--cell);font-family:var(--f-mono);font-weight:400;font-size:calc(var(--cell)*.5)}
.wgrid span{display:grid;place-items:center;color:rgba(243,239,232,.1);transition:color 1.2s ease,text-shadow 1.2s ease}
.wgrid span.lit{color:#fff4e2;text-shadow:0 0 calc(var(--cell)*.35) rgba(255,226,180,.6)}
.wdots{display:flex;gap:calc(var(--cell)*.7);margin-top:calc(var(--cell)*.3)}
.wdots i{width:calc(var(--cell)*.16);aspect-ratio:1;border-radius:50%;background:rgba(243,239,232,.12);transition:background 1s,box-shadow 1s}
.wdots i.lit{background:#fff4e2;box-shadow:0 0 8px rgba(255,226,180,.7)}

/* Sky */
.sky-ui{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.sky-time{font-family:var(--f-serif);font-size:min(27vh,15vw);line-height:.85;display:flex;align-items:baseline;gap:.12em}
.sky-time small{font-size:.24em;font-style:italic;opacity:.8}
.sky-sub{display:flex;gap:14px;align-items:baseline;margin-top:1.2vh;flex-wrap:wrap}
.sky-sub em{font-family:var(--f-serif);font-style:italic;font-size:max(16px,4.6vh);opacity:.92}
.sky-sub span{font-family:var(--f-mono);font-size:max(10px,2.1vh);letter-spacing:.18em;text-transform:uppercase;opacity:.65}

/* Drain */
#f-drain{background:linear-gradient(160deg,#101216,#0a0b0d 60%)}
.drain{display:flex;flex-direction:column;gap:2.4vh}
.d-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.d-title{font-family:var(--f-serif);font-style:italic;font-size:max(18px,5.6vh);color:var(--paper)}
.d-now{font-family:var(--f-mono);font-size:max(11px,2.4vh);letter-spacing:.14em;color:var(--dim)}
.d-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2.6vh 5vw;align-content:center;min-height:0}
.d-card{--c:var(--paper);display:grid;gap:.9vh;min-width:0}
.d-k{font-family:var(--f-mono);font-size:max(10px,2.1vh);letter-spacing:.18em;text-transform:uppercase;color:var(--c)}
.d-v{font-family:var(--f-ui);font-weight:300;font-size:min(11vh,6.4vw);line-height:1;letter-spacing:-.01em;white-space:nowrap}
.d-v small{font-size:.45em;color:var(--dim);margin-left:.1em}
.d-bar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.d-bar i{display:block;height:100%;background:var(--c);transform-origin:left;transform:scaleX(0)}
.d-left{font-family:var(--f-mono);font-size:max(10px,2.2vh);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (orientation:portrait){.d-grid{grid-template-columns:1fr}}

/* Chrome: dots, settings bar, hint */
#dots{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 6px);display:flex;gap:6px;z-index:4;transition:opacity .8s;pointer-events:none}
#dots i{width:5px;height:5px;border-radius:3px;background:rgba(243,239,232,.3);transition:width .3s,background .3s}
#dots i.on{width:16px;background:rgba(243,239,232,.85)}
#dots.quiet{opacity:0}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:4;font-size:12px;letter-spacing:.08em;color:rgba(243,239,232,.75);background:rgba(8,9,11,.55);padding:6px 12px;border-radius:99px;white-space:nowrap;transition:opacity 1s;pointer-events:none}
#hint.gone{opacity:0}
#bar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;font-size:13px;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(8,9,11,.88),rgba(8,9,11,.66));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);transform:translateY(-110%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#bar.show{transform:none}
#bar-name{font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#bar-name b{color:var(--paper);font-weight:400}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip,.ctl select{font:inherit;color:var(--paper);background:rgba(243,239,232,.08);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.ctl select{padding:5px 8px;-webkit-appearance:none;appearance:none}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.chip:focus-visible,.ctl select:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.ctl label{display:flex;align-items:center;gap:6px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){#track{transition:none!important}.wgrid span,.d,.a-colon{transition:none}}
</style>
</head>
<body>

<div id="probe"></div>
<div id="stage">
  <div id="track">

    <section class="face" id="aurora" data-name="Aurora">
      <canvas></canvas>
      <div class="pad aurora-ui">
        <div class="a-time num"><span id="a-h">10</span><span class="a-colon" id="a-colon">:</span><span id="a-m">42</span><span class="a-suf" id="a-suf">PM</span></div>
        <div class="a-date" id="a-date">Thursday 19 November</div>
        <div class="a-sec"><i id="a-sec"></i></div>
      </div>
    </section>

    <section class="face" id="orbit" data-name="Orbit">
      <canvas></canvas>
      <div class="pad orbit-ui">
        <div class="o-read">
          <div class="o-row" style="--c:var(--peach)"><span class="o-k">Hours</span><span class="o-v num" id="o-h">10</span></div>
          <div class="o-row" style="--c:var(--paper)"><span class="o-k">Minutes</span><span class="o-v num" id="o-m">42</span></div>
          <div class="o-row" style="--c:var(--mint)"><span class="o-k">Seconds</span><span class="o-v num" id="o-s">07</span></div>
          <div class="o-date" id="o-date">Day 323 of 365</div>
        </div>
      </div>
    </section>

    <section class="face" id="sweep" data-name="Sweep">
      <canvas></canvas>
      <div class="sw-foot"><span id="sw-tz">Local time</span><span id="sw-moon">Moon</span></div>
    </section>

    <section class="face" id="nixie" data-name="Nixie">
      <div class="pad nx">
        <div class="tubes" id="tubes"></div>
        <div class="nx-foot" id="nx-foot">PM · Thursday</div>
      </div>
    </section>

    <section class="face" id="words" data-name="Words">
      <div class="pad words-ui">
        <div class="wgrid" id="wgrid"></div>
        <div class="wdots" id="wdots"><i></i><i></i><i></i><i></i></div>
      </div>
    </section>

    <section class="face" id="sky" data-name="Sky">
      <canvas></canvas>
      <div class="pad sky-ui">
        <div class="sky-time num"><span id="s-t">4:42</span><small id="s-suf">pm</small></div>
        <div class="sky-sub"><em id="s-part">late afternoon</em><span id="s-date">Thu 19 Nov</span></div>
      </div>
    </section>

    <section class="face" id="drain" data-name="Drain">
      <div class="pad drain">
        <header class="d-head"><span class="d-title">Slipping by</span><span class="d-now num" id="d-now">4:42:07 PM</span></header>
        <div class="d-grid">
          <article class="d-card" id="dc-day" style="--c:var(--mint)"><div class="d-k">Today</div><div class="d-v num"><span class="pct">0</span><small>% gone</small></div><div class="d-bar"><i></i></div><div class="d-left num"></div></article>
          <article class="d-card" id="dc-work" style="--c:var(--ember)"><div class="d-k">Workday</div><div class="d-v num"><span class="pct">0</span><small>% gone</small></div><div class="d-bar"><i></i></div><div class="d-left num"></div></article>
          <article class="d-card" id="dc-week" style="--c:var(--paper)"><div class="d-k">This week</div><div class="d-v num"><span class="pct">0</span><small>% gone</small></div><div class="d-bar"><i></i></div><div class="d-left num"></div></article>
          <article class="d-card" id="dc-year" style="--c:var(--lilac)"><div class="d-k">This year</div><div class="d-v num"><span class="pct">0</span><small>% gone</small></div><div class="d-bar"><i></i></div><div class="d-left num"></div></article>
        </div>
      </div>
    </section>

  </div>
</div>

<div id="dots"></div>
<div id="hint">Swipe for more clocks · tap for settings</div>
<div id="bar" role="toolbar" aria-label="Clock settings">
  <span id="bar-name"><b>Aurora</b> 1 / 7</span>
  <div class="ctl">
    <button class="chip" id="b-24" type="button" aria-pressed="false">24-hour</button>
    <button class="chip" id="b-awake" type="button" aria-pressed="true">Keep screen on</button>
    <label for="b-ws">Workday <select id="b-ws" aria-label="Workday starts"></select> to <select id="b-we" aria-label="Workday ends"></select></label>
    <button class="chip" id="b-hide" type="button" aria-label="Hide settings">Done</button>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, PI=Math.PI;
const pad2=n=>String(n).padStart(2,'0');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const set=(el,v)=>{if(el._v!==v){el._v=v;el.textContent=v;}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- prefs ---------- */
const prefs={h24:false,awake:true,ws:9,we:17};
try{Object.assign(prefs,JSON.parse(localStorage.getItem('slowhours')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('slowhours',JSON.stringify(prefs))}catch(e){}};

function hm(d){
  let h=d.getHours(); const suf=h<12?'AM':'PM';
  const hs=prefs.h24?pad2(h):String(h%12||12);
  return {h:hs,m:pad2(d.getMinutes()),s:pad2(d.getSeconds()),suf:prefs.h24?'':suf};
}
const fmtHour=h=>prefs.h24?pad2(h)+':00':((h%12||12)+(h<12?'am':'pm'));

/* ---------- geometry ---------- */
let INS={t:0,r:0,b:0,l:0};
function readInsets(){const cs=getComputedStyle($('#probe'));INS={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
function fit(c,scale=1){
  const dpr=Math.min(window.devicePixelRatio||1,2)*scale;
  const w=c.clientWidth,h=c.clientHeight,W=Math.max(1,Math.round(w*dpr)),H=Math.max(1,Math.round(h*dpr));
  if(c.width!==W||c.height!==H){c.width=W;c.height=H;}
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  return {x,w,h};
}
const box=(w,h)=>{const l=Math.max(16,INS.l),r=Math.max(16,INS.r),t=Math.max(12,INS.t),b=Math.max(14,INS.b);return {l,r,t,b,cw:w-l-r,ch:h-t-b};};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
function stars(n,seed){let s=seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;return Array.from({length:n},()=>({x:r(),y:r(),r:r()*1.1+.25,p:r()*TAU,sp:.5+r()*1.5}));}
function moonPhase(d){const syn=29.530588853,ref=Date.UTC(2000,0,6,18,14);let p=((d.getTime()-ref)/864e5/syn)%1;return p<0?p+1:p;}
function moonName(p){return p<.03||p>.97?'New moon':p<.22?'Waxing crescent':p<.28?'First quarter':p<.47?'Waxing gibbous':p<.53?'Full moon':p<.72?'Waning gibbous':p<.78?'Last quarter':'Waning crescent';}
function dayOfYear(d){const s=new Date(d.getFullYear(),0,1);return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-s)/864e5)+1;}
const daysInYear=y=>(new Date(y+1,0,1)-new Date(y,0,1))/864e5;
const longDate=d=>d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});

/* ---------- faces ---------- */
const faces={};

/* Aurora: drifting colour fields whose hue follows the time of day */
faces.aurora=(()=>{
  const el=$('#aurora'),c=el.querySelector('canvas');
  const blobs=[{sx:.07,sy:.09,p:0,r:.6,dh:0},{sx:.05,sy:.04,p:2,r:.5,dh:45},{sx:.08,sy:.06,p:4,r:.45,dh:-55},{sx:.04,sy:.07,p:5.5,r:.62,dh:100}];
  return {draw(now,d){
    const {x,w,h}=fit(c,.25);
    const t=now/1000*(RM?.25:1);
    const base=((d.getHours()*60+d.getMinutes())/1440*360+200)%360;
    x.globalCompositeOperation='source-over';
    x.fillStyle=`hsl(${base},45%,7%)`;x.fillRect(0,0,w,h);
    x.globalCompositeOperation='lighter';
    for(const b of blobs){
      const bx=w*(.5+.4*Math.sin(t*b.sx+b.p)),by=h*(.5+.45*Math.cos(t*b.sy+b.p*1.7)),r=Math.max(w,h)*b.r;

/* Orbit: hours, minutes and seconds as concentric orbits */
faces.orbit=(()=>{
  const el=$('#orbit'),c=el.querySelector('canvas'),st=stars(140,11);
  const C={s:hex('#7fe0c8'),m:hex('#f3efe8'),h:hex('#ffb38a')};
  return {draw(now,d){
    const {x,w,h}=fit(c);const B=box(w,h);
    x.fillStyle='#07090c';x.fillRect(0,0,w,h);
    for(const s of st){x.fillStyle=`rgba(243,239,232,${.15+.35*(.5+.5*Math.sin(now/1000*s.sp+s.p))})`;x.beginPath();x.arc(s.x*w,s.y*h,s.r,0,TAU);x.fill();}
    const portrait=h>w;
    const cx=portrait?w/2:B.l+B.cw*.33,cy=B.t+B.ch/2;
    const R=Math.max(20,Math.min(portrait?B.cw/2-16:B.cw*.29,B.ch/2-14));
    const sec=(d.getSeconds()+d.getMilliseconds()/1000)/60,min=(d.getMinutes()+sec)/60,hr=((d.getHours()%12)+min)/12;
    const rings=[{r:R,f:sec,n:60,c:C.s,lw:2},{r:R*.76,f:min,n:60,c:C.m,lw:3},{r:R*.52,f:hr,n:12,c:C.h,lw:4}];
    for(const g of rings){
      x.lineWidth=1;x.strokeStyle='rgba(243,239,232,.07)';x.beginPath();x.arc(cx,cy,g.r,0,TAU);x.stroke();
      for(let i=0;i<g.n;i++){const a=i/g.n*TAU-PI/2,big=g.n===12||i%5===0;x.fillStyle=big?'rgba(243,239,232,.32)':'rgba(243,239,232,.12)';x.beginPath();x.arc(cx+Math.cos(a)*(g.r+8),cy+Math.sin(a)*(g.r+8),big?1.3:.7,0,TAU);x.fill();}
      const a0=-PI/2,a1=a0+g.f*TAU;

      if(x.createConicGradient){const cg=x.createConicGradient(a0,cx,cy);cg.addColorStop(0,rgba(g.c,0));cg.addColorStop(Math.max(.001,g.f),rgba(g.c,.95));cg.addColorStop(1,rgba(g.c,.95));stroke=cg;}
      x.strokeStyle=stroke;x.lineWidth=g.lw;x.lineCap='round';x.shadowColor=rgba(g.c,.7);x.shadowBlur=14;
      x.beginPath();x.arc(cx,cy,g.r,a0,a1);x.stroke();
      x.shadowBlur=22;x.fillStyle=rgb(g.c);x.beginPath();x.arc(cx+Math.cos(a1)*g.r,cy+Math.sin(a1)*g.r,g.lw+2.5,0,TAU);x.fill();

/* Sweep: an analogue dial with date, weekday and moon phase */
faces.sweep=(()=>{
  const el=$('#sweep'),c=el.querySelector('canvas');
  const tz=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){return ''}})();
  const city=(tz.split('/').pop()||'Local').replace(/_/g,' ');
  function hand(x,a,len,tail,w0,w1,col){x.save();x.rotate(a);x.beginPath();x.moveTo(-w0/2,tail);x.lineTo(-w1/2,-len);x.lineTo(w1/2,-len);x.lineTo(w0/2,tail);x.closePath();x.fillStyle=col;x.fill();x.restore();}
  function moon(x,cx,cy,r,p){
    x.save();x.beginPath();x.arc(cx,cy,r,0,TAU);x.fillStyle='#24211d';x.fill();x.clip();
    const lit='#e9e1d3',dark='#24211d',k=Math.cos(TAU*p);
    x.fillStyle=lit;x.beginPath();
    if(p<.5)x.arc(cx,cy,r,-PI/2,PI/2);else x.arc(cx,cy,r,PI/2,PI*1.5);
    x.closePath();x.fill();
    x.beginPath();x.ellipse(cx,cy,Math.max(.01,r*Math.abs(k)),r,0,0,TAU);x.fillStyle=k>0?dark:lit;x.fill();
    x.restore();
  }
  return {draw(now,d){
    const {x,w,h}=fit(c);const B=box(w,h);
    const cx=w/2,cy=B.t+B.ch/2,R=Math.max(30,Math.min(B.ch,B.cw)/2-6);
    const bg=x.createRadialGradient(cx,cy,R*.2,cx,cy,Math.max(w,h)*.75);bg.addColorStop(0,'#1c1915');bg.addColorStop(1,'#080707');
    x.fillStyle=bg;x.fillRect(0,0,w,h);
    const dial=x.createRadialGradient(cx,cy-R*.4,R*.1,cx,cy,R);dial.addColorStop(0,'#1d1a16');dial.addColorStop(1,'#110f0d');
    x.fillStyle=dial;x.beginPath();x.arc(cx,cy,R,0,TAU);x.fill();
    x.strokeStyle='rgba(236,229,216,.1)';x.lineWidth=1;x.stroke();
    x.save();x.translate(cx,cy);
    for(let i=0;i<60;i++){x.save();x.rotate(i/60*TAU);
      if(i%5===0){x.fillStyle='#ece5d8';x.fillRect(-R*.014,-R*.95,R*.028,R*.11);}
      else{x.fillStyle='rgba(236,229,216,.35)';x.fillRect(-.5,-R*.95,1,R*.04);}
      x.restore();}
    x.restore();
    // windows
    const fs=Math.max(9,R*.075);x.font=`400 ${fs}px "DM Mono", monospace`;x.textAlign='center';x.textBaseline='middle';
    const ww=R*.2,wh=R*.12;
    x.fillStyle='#ece5d8';x.fillRect(cx+R*.62-ww/2,cy-wh/2,ww,wh);x.fillStyle='#16130f';x.fillText(String(d.getDate()),cx+R*.62,cy+1);
    x.fillStyle='rgba(236,229,216,.08)';x.fillRect(cx-R*.62-ww*.65,cy-wh/2,ww*1.3,wh);x.fillStyle='rgba(236,229,216,.75)';x.fillText(d.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase(),cx-R*.62,cy+1);
    x.font=`500 ${Math.max(8,R*.045)}px "Space Grotesk", sans-serif`;x.fillStyle='rgba(236,229,216,.45)';x.fillText('S L O W   H O U R S',cx,cy-R*.4);
    // moon sub-dial
    const p=moonPhase(d),my=cy+R*.44;
    x.strokeStyle='rgba(236,229,216,.18)';x.beginPath();x.arc(cx,my,R*.15,0,TAU);x.stroke();
    moon(x,cx,my,R*.1,p);
    // hands
    const sec=(d.getSeconds()+d.getMilliseconds()/1000)/60,min=(d.getMinutes()+sec)/60,hr=((d.getHours()%12)+min)/12;
    x.save();x.translate(cx,cy);
    x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=R*.04;x.shadowOffsetY=R*.018;
    hand(x,hr*TAU,R*.52,R*.08,R*.06,R*.032,'#ece5d8');
    hand(x,min*TAU,R*.8,R*.1,R*.045,R*.022,'#ece5d8');
    x.save();x.rotate(sec*TAU);x.fillStyle='#ff8a3d';x.fillRect(-1,-R*.9,2,R*1.1);x.beginPath();x.arc(0,R*.17,R*.03,0,TAU);x.fill();x.restore();
    x.shadowBlur=0;x.shadowOffsetY=0;
    x.fillStyle='#ff8a3d';x.beginPath();x.arc(0,0,R*.03,0,TAU);x.fill();
    x.fillStyle='#16130f';x.beginPath();x.arc(0,0,R*.012,0,TAU);x.fill();
    x.restore();
    const off=-d.getTimezoneOffset(),oh=Math.trunc(off/60),om=Math.abs(off%60);
    set($('#sw-tz'),`${city} · UTC${off>=0?'+':'−'}${Math.abs(oh)}${om?':'+pad2(om):''}`);
    set($('#sw-moon'),`${moonName(p)} · ${Math.round((1-Math.cos(TAU*p))/2*100)}% lit`);
  }};
})();

/* Nixie: glowing cold-cathode tubes */
faces.nixie=(()=>{
  const wrap=$('#tubes'),tubes=[];let colons=[];let cs=0;
  const layout=['d','d','c','d','d','c','d','d'];
  for(const k of layout){
    const cell=document.createElement('div');cell.className='cell';
    const t=document.createElement('div');t.className='tube'+(k==='c'?' narrow':'');
    if(k==='d'){const ds=[];for(let n=0;n<10;n++){const s=document.createElement('span');s.className='d';s.textContent=n;t.appendChild(s);ds.push(s);}tubes.push({ds,cur:null});}
    else{const dd=document.createElement('div');dd.className='dots2';dd.innerHTML='<i></i><i></i>';t.appendChild(dd);colons.push(dd);}
    const sock=document.createElement('div');sock.className='sock';
    cell.append(t,sock);wrap.appendChild(cell);
  }
  function show(i,ch){const T=tubes[i];if(T.cur===ch)return;if(T.cur!==null&&T.cur!==' ')T.ds[+T.cur].classList.remove('on');if(ch!==' ')T.ds[+ch].classList.add('on');T.cur=ch;}
  return {

    draw(now,d){

      for(let i=0;i<6;i++){let ch=str[i];if(!RM&&now<cs+300+i*160)ch=String((Math.floor(now/55)+i*7)%10);show(i,ch);}
      const on=d.getMilliseconds()<500;colons.forEach(c=>c.classList.toggle('on',on));

/* Words: the time spelled out to the nearest five minutes, dots for the rest */
faces.words=(()=>{
  const grid=$('#wgrid'),dots=[...$('#wdots').children];
  const ROWS=[['IT','~','IS','~~','HALF','~','TEN.m','~'],['QUARTER','~','TWENTY','~~'],['FIVE.m','~','PAST','~','TO','~','ONE'],['TWO','~','THREE','~','FOUR','~~'],['FIVE','~','SIX','~','SEVEN','~~'],['EIGHT','~','NINE','~','TEN','~~'],['ELEVEN','~','TWELVE','~~~'],['OCLOCK','~','AM','~','PM','~~~~']];
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const AB='ABCDEFGHIJKLMNOPRSTUVWYZ';
  const map={};let all=[];
  for(const row of ROWS)for(const tok of row){
    if(tok[0]==='~'){for(let i=0;i<tok.length;i++){const s=document.createElement('span');s.textContent=AB[Math.floor(rnd()*AB.length)];grid.appendChild(s);}}
    else{const word=tok.split('.')[0];map[tok]=[];for(const ch of word){const s=document.createElement('span');s.textContent=ch;grid.appendChild(s);map[tok].push(s);all.push(s);}}
  }
  const HOURS=['TWELVE','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN','ELEVEN'];
  const MIN={5:['FIVE.m','PAST'],10:['TEN.m','PAST'],15:['QUARTER','PAST'],20:['TWENTY','PAST'],25:['TWENTY','FIVE.m','PAST'],30:['HALF','PAST'],35:['TWENTY','FIVE.m','TO'],40:['TWENTY','TO'],45:['QUARTER','TO'],50:['TEN.m','TO'],55:['FIVE.m','TO']};
  let key='';
  return {
    resize(w,h){const B=box(w,h);const cell=Math.floor(Math.min(B.cw/16,(B.ch-10)/8.7)*.96);grid.style.setProperty('--cell',cell+'px');$('#wdots').style.setProperty('--cell',cell+'px');},
    draw(now,d){
      const H=d.getHours(),m=d.getMinutes(),m5=m-m%5;const k=H+':'+m;if(k===key)return;key=k;
      const ids=['IT','IS'];if(m5===0)ids.push('OCLOCK');else ids.push(...MIN[m5]);
      ids.push(HOURS[(m5>=35?H+1:H)%12]);ids.push(H<12?'AM':'PM');
      const on=new Set();ids.forEach(id=>map[id].forEach(s=>on.add(s)));
      all.forEach(s=>s.classList.toggle('lit',on.has(s)));
      dots.forEach((dt,i)=>dt.classList.toggle('lit',i<m%5));
    }
  };
})();

/* Sky: the sun (or moon) crosses a sky that changes colour with the hour */
faces.sky=(()=>{
  const el=$('#sky'),c=el.querySelector('canvas'),st=stars(160,23);
  const SKY=[[0,'#04060e','#0b1024'],[4.5,'#070a18','#151b38'],[5.5,'#1f2148','#6d4a72'],[6.3,'#3d4f8a','#f29a6b'],[7.5,'#5a8fd0','#f3d2a4'],[10,'#3f86d8','#a9d3f2'],[15,'#3a7fd2','#b2d8f0'],[17.2,'#5874b8','#f5b780'],[18.1,'#3a3672','#e8785a'],[19,'#17183d','#5a3558'],[20,'#080b1c','#161a35'],[24,'#04060e','#0b1024']].map(r=>[r[0],hex(r[1]),hex(r[2])]);
  const HILLS=[{y:.68,a:.05,f:[1.3,2.9,5.1],k:.5},{y:.79,a:.05,f:[.9,2.2,4.3],k:.7},{y:.9,a:.05,f:[1.7,3.3,6.2],k:.86}];
  const NIGHT=hex('#05060a');
  function skyAt(hf){for(let i=0;i<SKY.length-1;i++){const a=SKY[i],b=SKY[i+1];if(hf>=a[0]&&hf<=b[0]){let k=(hf-a[0])/(b[0]-a[0]);k=k*k*(3-2*k);return [mix(a[1],b[1],k),mix(a[2],b[2],k)];}}return [SKY[0][1],SKY[0][2]];}
  function part(h){return h<4?'the small hours':h<6?'before dawn':h<9?'morning':h<12?'late morning':h<13?'midday':h<16?'afternoon':h<18?'late afternoon':h<20?'evening':h<23?'night':'nearly tomorrow';}
  return {draw(now,d){
    const {x,w,h}=fit(c);const B=box(w,h);
    const hf=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
    const [top,bot]=skyAt(hf);
    const g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,rgb(top));g.addColorStop(1,rgb(bot));x.fillStyle=g;x.fillRect(0,0,w,h);
    const nightA=hf>=20||hf<4.5?1:hf>=18.5?(hf-18.5)/1.5:hf<6?(6-hf)/1.5:0;
    if(nightA>0)for(const s of st){if(s.y>.7)continue;x.fillStyle=`rgba(255,255,255,${nightA*(.25+.5*(.5+.5*Math.sin(now/1000*s.sp+s.p)))})`;x.beginPath();x.arc(s.x*w,s.y*h*.95,s.r,0,TAU);x.fill();}
    const top0=B.t+20,base=h*.74;
    const body=(t,isSun)=>{
      const bx=B.l+B.cw*(.04+.92*t),by=base-Math.sin(PI*t)*(base-top0);
      const alt=Math.sin(PI*t);
      const core=isSun?mix(hex('#ff9a5a'),hex('#fff4dc'),clamp(alt*2.2,0,1)):hex('#eeeadf');
      const gr=x.createRadialGradient(bx,by,0,bx,by,isSun?Math.min(w,h)*.55:Math.min(w,h)*.25);
      gr.addColorStop(0,rgba(core,isSun?.55:.18));gr.addColorStop(1,rgba(core,0));
      x.fillStyle=gr;x.fillRect(0,0,w,h);
      x.fillStyle=rgb(core);x.beginPath();x.arc(bx,by,isSun?Math.max(12,h*.045):Math.max(9,h*.03),0,TAU);x.fill();
    };
    if(hf>=5.8&&hf<=18.2)body((hf-6)/12,true);
    else body((((hf-18)+24)%24)/12,false);
    for(const L of HILLS){
      x.beginPath();x.moveTo(0,h);
      for(let px=0;px<=w+8;px+=8){const u=px/w;x.lineTo(px,h*L.y-h*L.a*(Math.sin(u*L.f[0]*PI+1)+.5*Math.sin(u*L.f[1]*PI+2)+.25*Math.sin(u*L.f[2]*PI+.5)));}
      x.lineTo(w,h);x.closePath();x.fillStyle=rgb(mix(mix(bot,top,.3),NIGHT,L.k));x.fill();
    }
    const tm=hm(d);
    set($('#s-t'),tm.h+':'+tm.m);set($('#s-suf'),tm.suf.toLowerCase());
    set($('#s-part'),part(d.getHours()));
    set($('#s-date'),d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}));
  }};
})();

/* Drain: how much of the day, workday, week and year has gone */
faces.drain=(()=>{
  const cards={};['day','work','week','year'].forEach(k=>{const el=$('#dc-'+k);cards[k]={k:el.querySelector('.d-k'),pct:el.querySelector('.pct'),bar:el.querySelector('.d-bar i'),left:el.querySelector('.d-left')};});
  function span(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),D=Math.floor(s/86400),H=Math.floor(s%86400/3600),M=Math.floor(s%3600/60),S=s%60;
    if(D)return `${D}d ${H}h ${pad2(M)}m ${pad2(S)}s`;if(H)return `${H}h ${pad2(M)}m ${pad2(S)}s`;return `${M}m ${pad2(S)}s`;}
  function fill(c,frac,dec,left,label){
    frac=clamp(frac,0,1);
    set(c.pct,frac===null?'—':(frac*100).toFixed(dec));c.bar.style.transform=`scaleX(${frac})`;set(c.left,left);if(label)set(c.k,label);
  }
  return {draw(now,d){
    const t=d.getTime(),y=d.getFullYear(),mo=d.getMonth(),da=d.getDate();
    const d0=new Date(y,mo,da).getTime(),d1=new Date(y,mo,da+1).getTime();
    fill(cards.day,(t-d0)/(d1-d0),3,`${span(d1-t)} left today`);
    const dow=(d.getDay()+6)%7;
    const ws=new Date(y,mo,da,prefs.ws).getTime(),we=new Date(y,mo,da,prefs.we).getTime();
    const wl=`Workday ${fmtHour(prefs.ws)}–${fmtHour(prefs.we)}`;
    if(dow>=5){set(cards.work.pct,'0');cards.work.bar.style.transform='scaleX(0)';set(cards.work.left,'Weekend. Not your problem.');set(cards.work.k,wl);}
    else if(t<ws)fill(cards.work,0,3,`Starts in ${span(ws-t)}`,wl);
    else if(t>=we)fill(cards.work,1,3,'Clocked off. Go rest.',wl);
    else fill(cards.work,(t-ws)/(we-ws),3,`${span(we-t)} to go`,wl);
    const k0=new Date(y,mo,da-dow).getTime(),k1=new Date(y,mo,da-dow+7).getTime();
    fill(cards.week,(t-k0)/(k1-k0),4,`${span(k1-t)} until Monday`);
    const y0=new Date(y,0,1).getTime(),y1=new Date(y+1,0,1).getTime();
    fill(cards.year,(t-y0)/(y1-y0),5,`${span(y1-t)} until ${y+1}`,String(y));
    const tm=hm(d);set($('#d-now'),`${tm.h}:${tm.m}:${tm.s}${tm.suf?' '+tm.suf:''}`);
  }};
})();

/* ---------- pager ---------- */
const stage=$('#stage'),track=$('#track');
const els=[...track.children],ids=els.map(e=>e.id),N=els.length;
const dotsEl=$('#dots');ids.forEach(()=>dotsEl.appendChild(document.createElement('i')));
let idx=0;
const fromHash=ids.indexOf(location.hash.slice(1));
if(fromHash>=0)idx=fromHash;else{try{const s=ids.indexOf(localStorage.getItem('slowhours-face'));if(s>=0)idx=s;}catch(e){}}
let animUntil=0;
function place(dx=0,anim=false){
  track.style.transition=anim&&!RM?'transform .6s cubic-bezier(.2,.8,.2,1)':'none';
  track.style.transform=`translate3d(calc(${-idx*100}% + ${dx}px),0,0)`;
}
function go(i,anim=true){
  const prev=idx;idx=clamp(i,0,N-1);place(0,anim);animUntil=performance.now()+700;
  [...dotsEl.children].forEach((d,j)=>d.classList.toggle('on',j===idx));
  $('#bar-name').innerHTML=`<b>${els[idx].dataset.name}</b> ${idx+1} / ${N}`;
  if(prev!==idx||!go.done){faces[ids[idx]].onShow?.();go.done=true;}
  try{localStorage.setItem('slowhours-face',ids[idx]);history.replaceState(null,'','#'+ids[idx]);}catch(e){}
  wakeDots();
}
let drag=null;
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,t:performance.now(),dx:0};try{stage.setPointerCapture(e.pointerId)}catch(_){}wakeDots();});
stage.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x;if((idx===0&&dx>0)||(idx===N-1&&dx<0))dx*=.3;drag.dx=dx;place(dx);});
const end=e=>{if(!drag)return;const W=stage.clientWidth,dt=performance.now()-drag.t,dx=drag.dx,v=dx/Math.max(dt,1);
  const moved=Math.abs(dx)>8||Math.abs(e.clientY-drag.y)>8;drag=null;
  if(dx<-W*.18||(v<-.45&&moved))go(idx+1);else if(dx>W*.18||(v>.45&&moved))go(idx-1);else go(idx);
  if(!moved&&dt<400)toggleBar();};
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('#bar'))return;if(e.key==='ArrowRight')go(idx+1);else if(e.key==='ArrowLeft')go(idx-1);else if(e.key===' '||e.key==='Enter')toggleBar();});
addEventListener('hashchange',()=>{const i=ids.indexOf(location.hash.slice(1));if(i>=0&&i!==idx)go(i);});

/* ---------- chrome ---------- */
let dotsT=0;function wakeDots(){dotsEl.classList.remove('quiet');clearTimeout(dotsT);dotsT=setTimeout(()=>dotsEl.classList.add('quiet'),3500);}
setTimeout(()=>$('#hint').classList.add('gone'),4500);
const bar=$('#bar');let barT=0;
function toggleBar(force){const show=force??!bar.classList.contains('show');bar.classList.toggle('show',show);clearTimeout(barT);if(show)barT=setTimeout(()=>bar.classList.remove('show'),8000);$('#hint').classList.add('gone');wake();}
bar.addEventListener('pointerdown',()=>{clearTimeout(barT);barT=setTimeout(()=>bar.classList.remove('show'),8000);});
const ws=$('#b-ws'),we=$('#b-we');
function fillSelects(){[ws,we].forEach((s,j)=>{s.innerHTML='';for(let h=j?1:0;h<=(j?24:23);h++){const o=document.createElement('option');o.value=h;o.textContent=h===24?(prefs.h24?'24:00':'12am'):fmtHour(h);s.appendChild(o);}});ws.value=prefs.ws;we.value=prefs.we;}
ws.addEventListener('change',()=>{prefs.ws=+ws.value;if(prefs.we<=prefs.ws){prefs.we=Math.min(24,prefs.ws+1);we.value=prefs.we;}save();});
we.addEventListener('change',()=>{prefs.we=+we.value;if(prefs.we<=prefs.ws){prefs.ws=Math.max(0,prefs.we-1);ws.value=prefs.ws;}save();});
$('#b-24').addEventListener('click',()=>{prefs.h24=!prefs.h24;save();syncBar();fillSelects();});
$('#b-awake').addEventListener('click',async()=>{prefs.awake=!prefs.awake;save();if(prefs.awake)await wake();else if(lock){try{await lock.release()}catch(e){}lock=null;}syncBar();});
$('#b-hide').addEventListener('click',()=>toggleBar(false));
function syncBar(){$('#b-24').setAttribute('aria-pressed',prefs.h24);const a=$('#b-awake');a.setAttribute('aria-pressed',prefs.awake);
  a.textContent=!('wakeLock' in navigator)?'Keep screen on (not supported here)':prefs.awake?(lock?'Screen stays on':'Keep screen on'):'Screen may sleep';}

/* wake lock */
let lock=null;
async function wake(){if(!prefs.awake||!('wakeLock' in navigator)||document.visibilityState!=='visible'||lock)return syncBar();
  try{lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null;syncBar();});}catch(e){lock=null;}syncBar();}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake();});

/* ---------- loop ---------- */
function onResize(){readInsets();faces.words.resize(stage.clientWidth,stage.clientHeight);}
addEventListener('resize',onResize);addEventListener('orientationchange',()=>setTimeout(onResize,250));
function frame(now){
  const d=new Date();
  const span=drag||now<animUntil?1:0;
  for(let i=Math.max(0,idx-span);i<=Math.min(N-1,idx+span);i++)faces[ids[i]].draw(now,d);
  requestAnimationFrame(frame);
}
onResize();fillSelects();syncBar();go(idx,false);wake();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(onResize);
requestAnimationFrame(frame);
})();
</script>
